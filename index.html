<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Fullscreen</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      width:100%;
      height:100vh;
      overflow:hidden;
      background:black;

      display:flex;
      justify-content:center;
      align-items:center;
    }

    video{
      width:100%;
      height:100%;
      object-fit:contain; /* video fit tanpa kepotong */
      background:black;
    }
  </style>
</head>
<body>

  <video autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
    Browser kamu tidak support video.
  </video>

</body>
</html>
